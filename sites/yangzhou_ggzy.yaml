schedule:
  enabled: true
  interval_seconds: 3600

limits:
  max_concurrency: 4
  request_interval_seconds: 0.2

request:
  method: GET
  headers:
    Referer: https://ggzyjyzx.yangzhou.gov.cn/jyxx/index.html
    Accept: application/json, text/javascript, */*; q=0.01
    X-Requested-With: XMLHttpRequest
  params: {}
  timeout_seconds: 30
  retries: 2
  retry_backoff_seconds: 0.8
  verify_ssl: true

pagination:
  mode: url_template
  start_page: 1
  end_page: 20
  url_template: "{base_url}&paramJson=%7B%22pageNo%22%3A{page}%2C%22pageSize%22%3A%2215%22%7D"

cookie:
  enabled: false

dedup:
  redis_hash_key: zhaobiao:domian:linkqc
  ttl_days: 30
  prune_probability: 0.01

list_extraction:
  response_html_selectors:
    - kind: jsonpath
      expr: $.data.html
  item_selectors:
    - kind: xpath
      expr: //ul//li[contains(@class, "clearfix")]
  link_selectors:
    - kind: xpath
      expr: .//a/@href
  title_selectors:
    - kind: xpath
      expr: .//a/@title
    - kind: xpath
      expr: normalize-space(string(.//a))
  date_selectors:
    - kind: xpath
      expr: .//span[contains(@class, "time")]/text()
  min_title_length: 6
  fallback_auto: false

detail_extraction:
  content_selectors:
    - kind: xpath
      expr: //div[contains(@class, "bt-content")]
    - kind: xpath
      expr: //div[contains(@class, "Article")]
  fallback_auto: true
  fallback_readability: true
  min_content_length: 30

attachments:
  enabled: true
  selectors:
    - kind: regex
      expr: '"downloadUrl"\s*:\s*"(.*?)"'
    - kind: xpath
      expr: //div[contains(@class, "article-appendix")]//a/@href
  allowed_extensions: []
  max_bytes: 52428800

classification:
  default_type: zhaobiao
  zhongbiao_keywords: [中标, 成交, 评标结果, 结果公示, 中标候选]

area_extraction:
  enabled: true
  fixed_value: 扬州市
  use_title_first: true

output:
  enabled: true
  queue_zhaobiao: zhaobiao:result:zhaobiao
  queue_zhongbiao: zhaobiao:result:zhongbiao
  attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
  attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件
