- id: ansteel_bid_result_engineering
  enabled: true
  name: 鞍钢集团电子招投标交易平台-中标公告-工程
  entry_urls:
    - http://www.ansteelscm.com/notice/pjtnotice/getPjtByPurchaseType

  schedule:
    enabled: true
    interval_seconds: 3600

  limits:
    max_concurrency: 2
    request_interval_seconds: 0.6

  request:
    method: POST
    headers:
      Accept: application/json, text/plain, */*
      Referer: http://bid.ansteelscm.com/cpu-angang-bid-fe/webportal.html
      Origin: http://bid.ansteelscm.com
      X-Requested-With: XMLHttpRequest
    params: {}
    json:
      pageNum: 0
      pageSize: 20
      purchaseType: 1
      noticeType: 22
    timeout_seconds: 40
    retries: 2
    retry_backoff_seconds: 0.8
    verify_ssl: false
    use_chrome: false

  pagination:
    # purchaseType=1 工程；noticeType=22 中标公告/公示（明细含 9=中标候选人公示、11=中标结果公告）
    mode: json_template
    json_template: '{"pageNum":{page_index},"pageSize":20,"purchaseType":1,"noticeType":22}'
    start_page: 1
    end_page: 3

  crypto:
    enabled: false

  detail_request:
    method: GET
    url_template: "http://www.ansteelscm.com/notice/pjtnotice/getPjtNoticeById?id={value}"

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors: []
    item_selectors:
      - kind: jsonpath
        expr: $.data.list[*]
    link_selectors:
      - kind: jsonpath
        expr: $.id
    title_selectors:
      - kind: jsonpath
        expr: $.title
    date_selectors:
      - kind: jsonpath
        expr: $.publishTime
    # 原文链接指向人类可读的中标公告页（portalcas SPA hash 路由）
    detail_url_template: "http://bid.ansteelscm.com/cpu-angang-bid-fe/portalcas.html#/pages/supply_notice/index?id={id}&noticeType=22&purchaseType={purchaseType}"
    min_title_length: 2
    fallback_auto: false

  detail_extraction:
    response_html_selectors: []
    content_selectors:
      # 中标候选人公示 / 中标结果公告的正文 HTML（<table> 版式：项目编号、委托方、标段名称、
      # 中标单位、中标总金额、备注说明）
      - kind: jsonpath
        expr: $.data.noticeUrl
      # 兜底：/notice/content/queryById 形态（data.noticeValue）；正文为空时整体落 $.data
      - kind: jsonpath
        expr: $.data.noticeValue
      - kind: jsonpath
        expr: $.data
    title_selectors:
      - kind: jsonpath
        expr: $.data.title
    date_selectors:
      - kind: jsonpath
        expr: $.data.publishTime
    fallback_auto: true
    fallback_readability: false
    min_content_length: 30

  attachments:
    # 实测 12 条中标公告正文中 0 个 href/src，站点不提供附件下载
    enabled: true
    selectors: []
    allowed_extensions: []
    max_bytes: 52428800

  classification:
    default_type: zhongbiao
    zhongbiao_keywords: []

  area_extraction:
    enabled: true
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件

