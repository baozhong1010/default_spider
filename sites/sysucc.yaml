# 中山大学肿瘤防治中心（sysucc.org.cn）采购公告类站点
# 注意：站点有 Cookie 反爬（首请求 302 下发 CT6T/CT6TS，带回后才 200），
# 已由抓取器的 CookieJar 自动处理。详情页为 /node/{nid}。

- id: sysucc_cgzb
  enabled: true
  name: 中山大学肿瘤防治中心-采购招标
  entry_urls:
    - https://www.sysucc.org.cn/cgzb

  schedule:
    enabled: true
    interval_seconds: 3600

  limits:
    max_concurrency: 3
    request_interval_seconds: 0.5

  request:
    method: GET
    headers:
      Referer: https://www.sysucc.org.cn/cgzb
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    params: {}
    timeout_seconds: 40
    retries: 2
    retry_backoff_seconds: 0.8
    verify_ssl: true

  pagination:
    mode: url_template
    start_page: 1
    end_page: 3
    url_template: "{base_url}?page={page_index}"

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors: []
    item_selectors:
      - kind: xpath
        expr: //ul[contains(@class, "list-4-0")]/li
    link_selectors:
      - kind: xpath
        expr: .//a[contains(@class, "truncate-2")]/@href
    title_selectors:
      - kind: xpath
        expr: .//a[contains(@class, "truncate-2")]//text()
    date_selectors:
      - kind: xpath
        expr: concat(.//div[contains(@class, "text-small")]/text(), "-", .//div[contains(@class, "text-h4")]/text())
    min_title_length: 4
    fallback_auto: false

  detail_extraction:
    response_html_selectors: []
    content_selectors:
      - kind: xpath
        expr: //div[contains(@class, "field field-body")]
    fallback_auto: true
    fallback_readability: true
    min_content_length: 30

  attachments:
    enabled: true
    selectors:
      - kind: xpath
        expr: //div[contains(@class, "field field-body")]//a/@href
    allowed_extensions: []
    max_bytes: 52428800

  classification:
    default_type: zhaobiao
    zhongbiao_keywords: []

  area_extraction:
    enabled: true
    fixed_value: 广东
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件

