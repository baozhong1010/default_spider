id: yangzhou_zfcg
enabled: true
name: 扬州市政府采购网-公开招标公告
entry_urls:
  - https://zfcg.yangzhou.gov.cn/api-gateway/jpaas-publish-server/front/page/build/unit

schedule:
  enabled: true
  interval_seconds: 3600

limits:
  max_concurrency: 4
  request_interval_seconds: 0.2

request:
  method: GET
  headers:
    Referer: https://zfcg.yangzhou.gov.cn/cgxx/cggg/gkzbgg/index.html
    Accept: application/json, text/javascript, */*; q=0.01
    X-Requested-With: XMLHttpRequest
  params: {}
  timeout_seconds: 30
  retries: 2
  retry_backoff_seconds: 0.8
  verify_ssl: true

pagination:
  mode: url_template
  start_page: 1
  end_page: 40
  url_template: "{base_url}?parseType=bulidstatic&webId=zjTy7McFmdSHiAtQUfW7n&tplSetId=kRaek8CcqedjKq3sqAuf4&pageType=column&tagId=%E5%BD%93%E5%89%8D%E6%A0%8F%E7%9B%AE%E4%BF%A1%E6%81%AF&pageId=O9yrGsQX6Vl7dkc15Y3KS&paramJson=%7B%22pageNo%22%3A{page}%2C%22pageSize%22%3A%2215%22%7D"

cookie:
  enabled: false

dedup:
  redis_hash_key: zhaobiao:domian:linkqc
  ttl_days: 30
  prune_probability: 0.01

list_extraction:
  response_html_selectors:
    - kind: jsonpath
      expr: $.data.html
  item_selectors:
    - kind: xpath
      expr: //ul//li[contains(@class, "cf")]
  link_selectors:
    - kind: xpath
      expr: .//a/@href
  title_selectors:
    - kind: xpath
      expr: .//a/@title
    - kind: xpath
      expr: normalize-space(string(.//a))
  date_selectors:
    - kind: xpath
      expr: .//span[contains(@class, "data")]/text()
  min_title_length: 6
  fallback_auto: false

detail_extraction:
  content_selectors:
    - kind: xpath
      expr: //div[contains(@class, "Article")]
  fallback_auto: true
  fallback_readability: true
  min_content_length: 30

attachments:
  enabled: true
  selectors:
    - kind: xpath
      expr: //div[contains(@class, "article-appendix")]//a/@href
    - kind: regex
      expr: '"downloadUrl"\s*:\s*"(.*?)"'
  allowed_extensions: []
  max_bytes: 52428800

classification:
  default_type: zhaobiao
  zhongbiao_keywords: [中标, 成交, 结果, 合同, 废标, 终止]

area_extraction:
  enabled: true
  fixed_value: 江苏
  use_title_first: true

output:
  enabled: true
  queue_zhaobiao: zhaobiao:result:zhaobiao
  queue_zhongbiao: zhaobiao:result:zhongbiao
  attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
  attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件
