# 中国政府采购招标网（www.chinabidding.org.cn）——静态 HTML 站点
# 栏目（导航/栏目页均 GET 匿名可访问，无登录墙）：
#   - 招标公告  BidInfoList_bt_0.html  详情 BidInfoDetails_bid_<nid>.html
#   - 中标公告  BidInfoList_bt_3.html  详情 BidInfoDetails_bid_<nid>.html
#   - 采购公告  PurchaseInfoList_pt_0.html  详情 PurchaseInfoDetails_pid_<nid>.html
# 列表为 ASP.NET 静态表格，每页 25 条；分页 URL：<前缀>_id_<page>_ty_<n>.html。
# 注意：列表 <a ... href='...'/>标题</a> 中 href 后自带自闭合 "/"，
# lxml 会把 <a> 解析为空元素、标题文本落在 <a> 的 tail（td[2] 内），
# 故标题取 td[2] 文本而非 a 内文本。
# 详情正文在 td#content（公开摘要正文）；附件下载需登录，故禁用附件抓取。

- id: cbo_zbgg
  enabled: true
  name: 中国政府采购招标网-招标公告
  entry_urls:
    - http://www.chinabidding.org.cn/BidInfoList_bt_0.html

  schedule:
    enabled: true
    interval_seconds: 3600

  limits:
    max_concurrency: 3
    request_interval_seconds: 0.5

  request:
    method: GET
    headers:
      Referer: http://www.chinabidding.org.cn/BidInfoList_bt_0.html
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    params: {}
    timeout_seconds: 40
    retries: 2
    retry_backoff_seconds: 0.8
    verify_ssl: true

  pagination:
    mode: url_template
    start_page: 1
    end_page: 3
    url_template: "http://www.chinabidding.org.cn/BidInfoList_id_{page}_ty_0.html"

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors: []
    item_selectors:
      - kind: xpath
        expr: //tr[@align='center'][td/a[contains(@href,'BidInfoDetails_bid')]]
    link_selectors:
      - kind: xpath
        expr: .//a[contains(@href,'BidInfoDetails_bid')]/@href
    title_selectors:
      - kind: xpath
        expr: ./td[2]//text()
    date_selectors:
      - kind: xpath
        expr: ./td[3]//text()
    min_title_length: 8
    fallback_auto: false

  detail_extraction:
    response_html_selectors: []
    content_selectors:
      - kind: xpath
        expr: //td[@id="content"]
    title_selectors:
      - kind: xpath
        expr: //span[@id="cphMain_tle"]//text()
    fallback_auto: true
    fallback_readability: true
    min_content_length: 30

  attachments:
    enabled: false
    selectors: []
    allowed_extensions: []
    max_bytes: 52428800

  classification:
    default_type: zhaobiao
    zhongbiao_keywords: []

  area_extraction:
    enabled: true
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件

