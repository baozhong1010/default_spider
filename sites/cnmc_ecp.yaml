    #      实测「交付页范围（各栏目第 1~3 页）共 540 条详情」里该形态只有 **1** 条
    #      （2024 年的 resultBulletin 老公告，第 4 页以后才有更多），代价可接受。
    selectors:
      - kind: regex
        expr: 'openFileById%26id%3D([0-9a-f]{32})'
    url_template: "https://ecp.cnmc.com.cn/zgysdzzb/cgUploadController.do?openFileById&id={value}"
    # URL 无后缀，必须留空 allowed_extensions
    allowed_extensions: []
    max_bytes: 52428800

  classification:
    # 终止/流标类，归招标侧（该栏偶见"中标公告"字样条目，仍按栏目固定分类）
    default_type: zhaobiao
    zhongbiao_keywords: []

  area_extraction:
    # ⚠ 刻意关闭（如实用空值，优于全量误标）：
    #   本站所有页面页脚都写着「办公地址：北京市朝阳区安定路10号中国有色大厦」，
    #   HTML 兜底正文里必然出现「北京市」；而 detect_area(title, content, cfg) 的
    #   title/content 两个池子**都会参与匹配**（area.py:100-105，use_title_first 只决定顺序），
    #   province_keywords 也拦不住（实测）。于是标题里没有地名时，地区必被页脚污染成「北京市」——
    #   实测 cnmc_feizhao 30 条里 25 条误标北京市，而「中色大冶（湖北）」「阳新弘盛（湖北）」
    #   这类项目实际都在湖北。
    #   代价：标题含地名时也不再输出地区（如「赤峰中色…」本可给出内蒙古自治区）。
    #   如确需地区，可靠做法是取真实项目所在地字段写入 list_extraction.area_selectors
    #   （本站列表/详情页无该字段，故未配）。
    enabled: false
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件

- id: cnmc_dayi
  enabled: true
  name: 中国有色集团采购招标电子商务平台-答疑补遗
  entry_urls:
    - https://ecp.cnmc.com.cn/zgyscms/category/bulletinList.html?categoryId=6&purType=00,01

  schedule:
    enabled: true
    interval_seconds: 3600

  limits:
    max_concurrency: 2
    request_interval_seconds: 1.0

  request:
    method: GET
    headers:
      Referer: https://ecp.cnmc.com.cn/zgyscms/category/bulletinList.html?categoryId=6&purType=00,01
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    params: {}
    timeout_seconds: 60
    retries: 2
    retry_backoff_seconds: 1.0
    verify_ssl: true

  pagination:
    mode: page_param
    start_page: 1
    end_page: 3
    page_param: page

  crypto:
    enabled: false

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors: []
    item_selectors:
      - kind: xpath
        expr: //tbody[@id="bulletinList"]/tr
    link_selectors:
      # 该栏目实测 30/30 行都没有 href，只能靠隐藏 input 的 value 取详情 URL
      - kind: xpath
        expr: .//a[1]/@href
      - kind: xpath
        expr: .//input[@type="hidden"]/@value
    title_selectors:
      - kind: xpath
        expr: .//a[1]/@title
      - kind: xpath
        expr: .//a[1]//text()
    date_selectors:
      - kind: xpath
        expr: .//td[2]//text()
    min_title_length: 6
    fallback_auto: false

  detail_extraction:
    response_html_selectors: []
    content_selectors:
      - kind: xpath
        expr: //div[contains(@class, "contant")]
      - kind: xpath
        expr: //div[contains(@class, "title")]
    title_selectors:
      - kind: xpath
        expr: //div[contains(@class, "title")]//text()
    date_selectors: []
    fallback_auto: false
    fallback_readability: false
    min_content_length: 30

  attachments:
    enabled: true
    # 同 cnmc_zhaobiao：只截 <32位hex>，再用 url_template 拼成站点接受的 openFileById&id=<hex>
    # 一个 regex 里放两个分组，命中哪种就走哪种（框架对每处命中取「第一个非空分组」）：
