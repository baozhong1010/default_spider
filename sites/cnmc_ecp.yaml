      - kind: xpath
        expr: //div[contains(@class, "title")]//text()
    date_selectors: []
    fallback_auto: false
    fallback_readability: false
    min_content_length: 30

  attachments:
    enabled: true
    # 同 cnmc_zhaobiao：只截 <32位hex>，再用 url_template 拼成站点接受的 openFileById&id=<hex>
    # 一个 regex 里放两个分组，命中哪种就走哪种（框架对每处命中取「第一个非空分组」）：
    #   A) 新式（绝大多数）：iframe file= 是 …cgUploadController.do%26id%3D<32位hex>，第 2 组捕获 hex
    #   B) 老式（如 2024 年的 resultBulletin/2024-07-17/248619.html，实测 1/30）：
    #      file= 直接是 https://ecp.cnmc.com.cn/upload/2024/07-17/16-04-…-1240152180.pdf，第 1 组捕获整条绝对地址
    #      （实测该地址 200 + application/pdf + %PDF-1.5 + 1,997,306 字节）
    # 只用 A) 会漏掉 B)（实测 cnmc_zhongbiao 30 条里有 1 条因此没有附件）。
    # 一个 regex、**只用捕获组 1**（框架对每处命中取「第一个非空捕获组」当 {value}），
    # 两种真实形态各自给出**完整可下载 URL**：
    #   A) 新式（绝大多数，实测 149/150）：iframe file= 原样就是
    #      https://ecp.cnmc.com.cn/zgysdzzb/cgUploadController.do?openFileById%26id%3D<32位hex>
    #      注意这里 ?openFileById 与 id 之间是 %26id%3D（& 被编码成 %26）——
    #      直接用这个「原样 URL」匿名 GET 实测 200 + application/pdf + %PDF-1.5，
    #      不需要还原成 &id=，也就**不需要 url_template 拼前缀**。
    #   B) 老式（如 2024 年的 resultBulletin/2024-07-17/248619.html，实测 1/150）：
    #      file= 直接是 https://ecp.cnmc.com.cn/upload/2024/07-17/16-04-…-1240152180.pdf
    #      （实测 200 + application/pdf + %PDF-1.5 + 1,997,306 字节）。
    # 踩过的坑（都实测过）：
    #   · 只用 A 的旧写法 'openFileById%26id%3D([0-9a-f]{32})' + url_template 拼前缀时，
    #     若把前缀写成 "…do?openFileById&id="，HTTP 客户端会把前缀的 ? 当第一段查询串，
    #     拼出 "…?openFileById&<hex>"（缺 id=）→ 404；
    #   · XPath 不能表达：concat(...) 返回字符串、//iframe/@src 返回节点集，
    #     'string | nodeset' 会被 lxml 判为 Invalid type（实测）；
    #   · 不要用 {fdId}：框架只把第 1 个捕获组放进 {value}，{fdId} 与 {value} 同值（详见 cdb_cg 注释里的对齐坑）。
    # ⚠ 两个硬约束（都实测踩过）：
    #   1) 整个表达式**只能有 1 个捕获组**。selectors 走 re.findall，2 个以上捕获组会返回**元组**，
    #      框架把元组 str() 成 "('https://…', '')" 当附件 URL（实测 200 + 309 字节异常页，
    #      180 条记录附件全废），故两条分支整体用 (?:…) 包住、整条 URL 一起捕获。
    #   2) %26id%3D 形态**不能**直接当下载地址：实测 200 + text/html + 309 字节，
    #      服务端报 UnsatisfiedServletRequestParameterException（Parameter conditions
    #      "openFile" not met）。必须还原成 &id=<hex> 才是 200 + application/pdf。
    #      实测对照：%26id%3D → 309 字节 HTML 异常页；&id= → 278,740 字节 %PDF-1.5。
    #   因此捕获组 1 只取 <32位hex>，前缀（含 &id=）由 url_template 补回。
    #   /upload/*.pdf 形态因此被排除（它对同一前缀会拼错 → 150 字节错误页）：
    #      实测「交付页范围（各栏目第 1~3 页）共 540 条详情」里该形态只有 **1** 条
    #      （2024 年的 resultBulletin 老公告，第 4 页以后才有更多），代价可接受。
    selectors:
      - kind: regex
        expr: 'openFileById%26id%3D([0-9a-f]{32})'
    url_template: "https://ecp.cnmc.com.cn/zgysdzzb/cgUploadController.do?openFileById&id={value}"
    # URL 无后缀，必须留空 allowed_extensions
    allowed_extensions: []
    max_bytes: 52428800

  classification:
    # 固定分类栏目（招标信息-非招公告：竞价/询价/询比/邀请函等非招标方式采购公告）
    default_type: zhaobiao
    zhongbiao_keywords: []

  area_extraction:
    # ⚠ 刻意关闭（如实用空值，优于全量误标）：
    #   本站所有页面页脚都写着「办公地址：北京市朝阳区安定路10号中国有色大厦」，
    #   HTML 兜底正文里必然出现「北京市」；而 detect_area(title, content, cfg) 的
    #   title/content 两个池子**都会参与匹配**（area.py:100-105，use_title_first 只决定顺序），
    #   province_keywords 也拦不住（实测）。于是标题里没有地名时，地区必被页脚污染成「北京市」——
    #   实测 cnmc_feizhao 30 条里 25 条误标北京市，而「中色大冶（湖北）」「阳新弘盛（湖北）」
    #   这类项目实际都在湖北。
    #   代价：标题含地名时也不再输出地区（如「赤峰中色…」本可给出内蒙古自治区）。
    #   如确需地区，可靠做法是取真实项目所在地字段写入 list_extraction.area_selectors
    #   （本站列表/详情页无该字段，故未配）。
    enabled: false
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件

