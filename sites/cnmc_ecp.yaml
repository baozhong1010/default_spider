    #   B) 老式（如 2024 年的 resultBulletin/2024-07-17/248619.html，实测 1/30）：
    #      file= 直接是 https://ecp.cnmc.com.cn/upload/2024/07-17/16-04-…-1240152180.pdf，第 1 组捕获整条绝对地址
    #      （实测该地址 200 + application/pdf + %PDF-1.5 + 1,997,306 字节）
    # 只用 A) 会漏掉 B)（实测 cnmc_zhongbiao 30 条里有 1 条因此没有附件）。
    # 一个 regex、**只用捕获组 1**（框架对每处命中取「第一个非空捕获组」当 {value}），
    # 两种真实形态各自给出**完整可下载 URL**：
    #   A) 新式（绝大多数，实测 149/150）：iframe file= 原样就是
    #      https://ecp.cnmc.com.cn/zgysdzzb/cgUploadController.do?openFileById%26id%3D<32位hex>
    #      注意这里 ?openFileById 与 id 之间是 %26id%3D（& 被编码成 %26）——
    #      直接用这个「原样 URL」匿名 GET 实测 200 + application/pdf + %PDF-1.5，
    #      不需要还原成 &id=，也就**不需要 url_template 拼前缀**。
    #   B) 老式（如 2024 年的 resultBulletin/2024-07-17/248619.html，实测 1/150）：
    #      file= 直接是 https://ecp.cnmc.com.cn/upload/2024/07-17/16-04-…-1240152180.pdf
    #      （实测 200 + application/pdf + %PDF-1.5 + 1,997,306 字节）。
    # 踩过的坑（都实测过）：
