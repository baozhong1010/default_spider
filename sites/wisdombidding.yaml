- id: wisdom_main_cgxq
  enabled: true
  name: 采管鹰主站-大额采购需求
  entry_urls:
    - https://wisdombidding.com/newBiddingAjax

  schedule:
    enabled: true
    interval_seconds: 3600

  limits:
    max_concurrency: 3
    request_interval_seconds: 0.5

  request:
    method: POST
    headers:
      Accept: 'application/json, text/javascript, */*; q=0.01'
      Referer: 'https://wisdombidding.com/largePurchase?csrf_token=2097213147433676800'
      X-Requested-With: XMLHttpRequest
    params: {}
    timeout_seconds: 40
    retries: 2
    retry_backoff_seconds: 0.8
    verify_ssl: true

  pagination:
    mode: data_template
    start_page: 1
    end_page: 3
    data_template: "csrf_token=2097213147433676800&orderTitle=&projectType=&orderType=2&orderTypeDesc=大额采购&inProvince=&collegeName=&deviceType=&orderField=&orderDirection2=&startEndtimePeriod=&curDay=&endBidtimePeriod=&curDay2=&submitByForm=&scrollTop=&coGroupOpen=&deviceTypeOpen=&queryKeyword=&pageSize=20&pageNum={page}"

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors:
      - kind: jsonpath
        expr: $.bidList[0]
    item_selectors:
      - kind: jsonpath
        expr: "$[*]"
    link_selectors:
      - kind: jsonpath
        expr: $.enquiryMainId
    title_selectors:
      - kind: jsonpath
        expr: $.orderTitle
    date_selectors:
      - kind: jsonpath
        expr: $.startBidtime
    detail_url_template: "https://wisdombidding.com/enquiryDetail/{value}"
    min_title_length: 4
    fallback_auto: false

  detail_extraction:
    response_html_selectors: []
    content_selectors:
      - kind: xpath
        expr: '//div[contains(@class, "wrap") and contains(@class, "clearFloat")]'
    fallback_auto: true
    fallback_readability: true
    min_content_length: 30

  attachments:
    enabled: false
    selectors: []
    allowed_extensions: []
    max_bytes: 52428800

  classification:
    default_type: zhaobiao
    zhongbiao_keywords: []

  area_extraction:
    enabled: true
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件
