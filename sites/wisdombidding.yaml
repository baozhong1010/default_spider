# 采管鹰快速采购平台（wisdombidding.com）招标/中标站点配置
# 注：wisdombidding.com/largePurchase 大额采购列表需登录，此处为可公开访问的 3 个子平台。

- id: wisdom_gc_zbgg
  enabled: true
  name: 采管鹰工程快采-采购公告
  entry_urls:
    - http://gc.wisdombidding.com/company/portal/zbggList

  schedule:
    enabled: true
    interval_seconds: 3600

  limits:
    max_concurrency: 3
    request_interval_seconds: 0.5

  request:
    method: GET
    headers:
      Referer: http://gc.wisdombidding.com/company/portal/zbggList
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    params: {}
    timeout_seconds: 40
    retries: 2
    retry_backoff_seconds: 0.8
    verify_ssl: true

  pagination:
    mode: page_param
    start_page: 1
    end_page: 3
    page_param: pageNum

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors: []
    item_selectors:
      - kind: xpath
        expr: //table[contains(@class, "tablaDetail")]/tbody/tr
    link_selectors:
      - kind: xpath
        expr: translate(substring-before(substring-after(.//a[contains(@class,'linka')]/@onclick,'('),')'),'"','')
    title_selectors:
      - kind: xpath
        expr: .//a[contains(@class, "linka")]//text()
    date_selectors:
      - kind: xpath
        expr: ./td[7]//text()
    detail_url_template: "http://gc.wisdombidding.com/company/portal/zbggDetail?id={value}"
    min_title_length: 4
    fallback_auto: false

  detail_extraction:
    response_html_selectors: []
    content_selectors:
      - kind: xpath
        expr: //div[contains(@class, "content")]//table
    fallback_auto: true
    fallback_readability: true
    min_content_length: 30

  attachments:
    enabled: true
    selectors:
      - kind: xpath
        expr: //a[contains(@href, "/attach") or contains(@href, "download")]/@href
    allowed_extensions: []
    max_bytes: 52428800

  classification:
    default_type: zhaobiao
    zhongbiao_keywords: []

  area_extraction:
    enabled: true
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件

- id: wisdom_jj_cgxq
  enabled: true
  name: 采管鹰竞价快采-采购需求
  entry_urls:
    - http://jj.wisdombidding.com/oddPurchase

  schedule:
    enabled: true
    interval_seconds: 3600

  limits:
    max_concurrency: 3
    request_interval_seconds: 0.5

  request:
    method: GET
    headers:
      Referer: http://jj.wisdombidding.com/oddPurchase
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
