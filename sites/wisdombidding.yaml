      - kind: xpath
        expr: .//a[contains(@class, "projectName")]/@href
    title_selectors:
      - kind: xpath
        expr: .//a[contains(@class, "projectName")]/@title
      - kind: xpath
        expr: .//a[contains(@class, "projectName")]//text()
