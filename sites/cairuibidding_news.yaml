id: cairuibidding_news
enabled: true
name: 上海财瑞招投标平台-招标信息
entry_urls:
  - https://www.cairuibidding.com.cn/CrZtb/portalweb/news

schedule:
  enabled: true
  interval_seconds: 3600

limits:
  max_concurrency: 3
  request_interval_seconds: 0.2

request:
  method: GET
  headers:
    Referer: https://www.cairuibidding.com.cn/CrZtb/portalweb/news
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
  params: {}
  timeout_seconds: 30
  retries: 2
  retry_backoff_seconds: 0.8
  verify_ssl: true

pagination:
  mode: none

cookie:
  enabled: false

dedup:
  redis_hash_key: zhaobiao:domian:linkqc
  ttl_days: 30
  prune_probability: 0.01

list_extraction:
  response_html_selectors: []
  item_selectors:
    - kind: xpath
      expr: //div[contains(@class, 'newspset')]/dl[.//h5/a]
  link_selectors:
    - kind: xpath
      expr: .//h5/a/@href
  title_selectors:
    - kind: xpath
      expr: .//h5/a/text()
  date_selectors:
    - kind: xpath
      expr: .//time/em/text()
    - kind: xpath
      expr: .//time/text()
  min_title_length: 6
  fallback_auto: false

detail_extraction:
  content_selectors:
    - kind: xpath
      expr: //div[contains(@class, 'notice-content')]
  fallback_auto: false
  fallback_readability: false
  min_content_length: 30

attachments:
  enabled: true
  selectors:
    - kind: xpath
      expr: //div[contains(@class, 'notice-content')]//a/@href
  allowed_extensions: []
  max_bytes: 52428800

classification:
  default_type: zhaobiao
  zhongbiao_keywords: [中标, 成交, 结果, 候选人, 评审结果, 定标, 结果公告]

area_extraction:
  enabled: true
  fixed_value: 上海
  use_title_first: true

output:
  enabled: true
  queue_zhaobiao: zhaobiao:result:zhaobiao
  queue_zhongbiao: zhaobiao:result:zhongbiao
  attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
  attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件
