id: shabidding_project_notice
enabled: true
name: 上航招标网-项目公告
entry_urls:
  - https://www.shabidding.com/ekp/resource/news/sys_news_main/sysNewsMain.do?method=getNotice&type=1&rowsize=1000&templateId=13f89f0aecc9570a269328c4ea8b510d&showNotice=all&seacrhVal=

schedule:
  enabled: true
  interval_seconds: 3600

limits:
  max_concurrency: 3
  request_interval_seconds: 0.2

request:
  method: POST
  headers:
    Referer: https://www.shabidding.com/shgjzb/pc/secondaryPage/news.html?num=0&type=1&id=13f89f0aecc9570a269328c4ea8b510d
    Origin: https://www.shabidding.com
    Accept: application/json, text/javascript, */*; q=0.01
    X-Requested-With: XMLHttpRequest
  params: {}
  timeout_seconds: 30
  retries: 2
  retry_backoff_seconds: 0.8
  verify_ssl: true

pagination:
  mode: url_template
  start_page: 1
  end_page: 1
  url_template: "{base_url}&pageno={page}"

cookie:
  enabled: false

dedup:
  redis_hash_key: zhaobiao:domian:linkqc
  ttl_days: 30
  prune_probability: 0.01

list_extraction:
  response_html_selectors: []
  item_selectors:
    - kind: jsonpath
      expr: $.data[*]
  link_selectors:
    - kind: jsonpath
      expr: $.fdId
  title_selectors:
    - kind: jsonpath
      expr: $.fdSubject
  date_selectors:
    - kind: jsonpath
      expr: $.publishTime
  detail_url_template: https://www.shabidding.com/ekp/resource/news/sys_news_main/sysNewsMain.do?method=view&fdId={fdId}
  min_title_length: 6
  fallback_auto: false

detail_extraction:
  content_selectors:
    - kind: xpath
      expr: //div[@id="_____rtf__temp_____docContent"]
  fallback_auto: false
  fallback_readability: false
  min_content_length: 30

attachments:
  enabled: true
  selectors:
    - kind: regex
      expr: var\s+url\s*=\s*"([^"]*method=download[^"]+)"
  allowed_extensions: []
  max_bytes: 52428800

classification:
  default_type: zhaobiao
  zhongbiao_keywords: [中标, 成交, 结果, 候选人, 评审结果, 定标, 结果公告]

area_extraction:
  enabled: true
  fixed_value: ""
  use_title_first: true

output:
  enabled: true
  queue_zhaobiao: zhaobiao:result:zhaobiao
  queue_zhongbiao: zhaobiao:result:zhongbiao
  attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
  attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件
