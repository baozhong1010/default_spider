# 国铁采购平台（cg.95306.cn）采购公告类站点
# 列表接口：POST /proxy/portal/elasticSearch/queryProcurementNoticeList（表单）
# 详情接口：POST /proxy/portal/elasticSearch/indexView（表单，noticeId）
#
# 分页/排序参数说明（勿随意改动，2026-09 实测确认）：
# - sortCondition=1 才是「发布时间排序」（对应前端 #sortCondition 复选框，勾选时传 1）。
#   传 0 时接口返回的是默认相关度顺序的固定切片，新公告几乎不会进入该切片，
#   表现为「只能抓到某一天之前的数据，之后的抓不到」。
# - pageNum 从 1 开始（前端默认 '1'）。传 0 会被服务端归一为第 1 页，
#   若用 {page_index}（0,1,2）会重复抓第 1 页，导致 3 页只能得到 20 条去重记录。
# - mhId 传随机值即可（接口不校验其格式），无需真实浏览器指纹。
# - 请求过快时接口会返回 {"success": false, "code": "0-0203"}（HTTP 仍是 200），
#   需保持 limits.request_interval_seconds 间隔，避免被判为限流。

- id: cg95306_zbgg
  enabled: true
  name: 国铁采购平台-采购公告(项目公告)
  entry_urls:
    - https://cg.95306.cn/proxy/portal/elasticSearch/queryProcurementNoticeList

  schedule:
    enabled: true
    interval_seconds: 3600

  limits:
    max_concurrency: 3
    request_interval_seconds: 0.5

  request:
    method: POST
    headers:
      Referer: https://cg.95306.cn/baseinfor/notice/procurementNotice
      Accept: application/json, text/javascript, */*; q=0.01
      X-Requested-With: XMLHttpRequest
    params: {}
    timeout_seconds: 40
    retries: 2
    retry_backoff_seconds: 0.8
    verify_ssl: true

  pagination:
    mode: data_template
    start_page: 1
    end_page: 3
    data_template: "mhId={random}&Authorization=&projBidType=01&bidType=&noticeType=01&wzType=&title=&unitType=&inforCode=&startDate=&endDate=&pageNum={page}&projType=01&createPeopUnit=&sortCondition=1"

  detail_request:
    method: POST
    url: "https://cg.95306.cn/proxy/portal/elasticSearch/indexView"
    data_template: "noticeId={link}&mhId={random}&Authorization="

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors: []
    item_selectors:
      - kind: jsonpath
        expr: $.data.resultData.result[*]
    link_selectors:
      - kind: jsonpath
        expr: $.id
    title_selectors:
      - kind: jsonpath
        expr: $.notTitle
    date_selectors:
      - kind: jsonpath
        expr: $.checkTime
    detail_url_template: "https://cg.95306.cn/baseinfor/notice/informationShow?id={value}"
    min_title_length: 4
    fallback_auto: false

  detail_extraction:
    response_html_selectors:
      - kind: jsonpath
        expr: $.data.noticeContent.notCont
    content_selectors:
      - kind: xpath
        expr: //body
    fallback_auto: true
    fallback_readability: true
    min_content_length: 20

  attachments:
    enabled: true
    selectors:
      - kind: jsonpath
        expr: $.data.forwardList[*].filepath
    filename_selectors:
      - kind: jsonpath
        expr: $.data.forwardList[*].filename
    allowed_extensions: []
    max_bytes: 52428800

  classification:
    default_type: zhaobiao
    zhongbiao_keywords: []

  area_extraction:
    enabled: true
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件

