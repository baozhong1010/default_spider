# 苏州市公共资源交易平台（www.szzyjy.com.cn）5 个分中心
# 列表接口：GET /EpointWebBuilder/JyxxSearchAction.action?cmd=getList1
# 详情页：静态 HTML /jyxx/{6位栏目}/{9位栏目}/{日期}/{infoid}.html

- id: suzhou_cs_zbgg
  enabled: true
  name: 苏州公共资源交易-常熟-建设工程-招标公告
  entry_urls:
    - https://www.szzyjy.com.cn/EpointWebBuilder/JyxxSearchAction.action

  schedule:
    enabled: true
    interval_seconds: 3600

  limits:
    max_concurrency: 2
    request_interval_seconds: 0.5

  request:
    method: GET
    headers:
      Referer: https://www.szzyjy.com.cn/cssfzx/032006/csCity_jyxx.html
      Accept: application/json, text/javascript, */*; q=0.01
      X-Requested-With: XMLHttpRequest
    params: {}
    timeout_seconds: 40
    retries: 2
    retry_backoff_seconds: 0.8
    verify_ssl: true

  pagination:
    mode: url_template
    start_page: 1
    end_page: 2
    url_template: "https://www.szzyjy.com.cn/EpointWebBuilder/JyxxSearchAction.action?cmd=getList1&categorynum=003001001&diqu=%E5%B8%B8%E7%86%9F%E5%B8%82&xmmc=&zstype=&zblx=&starttime=&endtime=&siteguid=7eb5f7f1-9041-43ad-8e13-8fcb82ea831a&pageIndex={page_index}&pageSize=15&YZM=&ImgGuid="

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors:
      - kind: jsonpath
        expr: $.custom
    item_selectors:
      - kind: jsonpath
        expr: $.Table[*]
    link_selectors:
      - kind: jsonpath
        expr: $.infoid
    title_selectors:
      - kind: jsonpath
        expr: $.title1
      - kind: jsonpath
        expr: $.title
    date_selectors:
      - kind: jsonpath
        expr: $.postdate
    detail_url_template: "https://www.szzyjy.com.cn/jyxx/{categorynum6}/{categorynum}/{postdate_nodash}/{infoid}.html"
    min_title_length: 4
    fallback_auto: false

  detail_extraction:
    response_html_selectors: []
    content_selectors:
      - kind: xpath
        expr: //div[contains(@class, "con")]
    fallback_auto: true
    fallback_readability: true
    min_content_length: 30

  attachments:
    enabled: true
    selectors:
      - kind: xpath
        expr: //div[contains(@class, "fj")]//a/@href
    filename_selectors:
      - kind: xpath
        expr: //div[contains(@class, "fj")]//a/@title
    allowed_extensions: []
    max_bytes: 52428800

  classification:
    default_type: zhaobiao
    zhongbiao_keywords: []

  area_extraction:
    enabled: true
    fixed_value: 江苏
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件

