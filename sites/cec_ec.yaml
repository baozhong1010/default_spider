      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
      Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    params: {}
    timeout_seconds: 40
    retries: 2
    retry_backoff_seconds: 0.8
    verify_ssl: true

  pagination:
    mode: page_param
    page_param: pageNo
    start_page: 1
    end_page: 3

  crypto:
    enabled: false

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors: []
    item_selectors:
      - kind: xpath
        expr: //div[contains(@class, "bidlist")]//ul[@id="list1"]/li//a
    link_selectors:
      - kind: xpath
        expr: ./@href
    title_selectors:
      - kind: xpath
        expr: ./@title
