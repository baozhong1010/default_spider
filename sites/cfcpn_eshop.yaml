      Accept: application/json, text/plain, */*
      Content-Type: application/json;charset=UTF-8
      Origin: http://www.e-shop.cfcpn.com
      Referer: http://www.e-shop.cfcpn.com/
    json: {}
    timeout_seconds: 40
    retries: 2
    retry_backoff_seconds: 0.8
    verify_ssl: false
    use_chrome: false

  pagination:
    mode: none
    start_page: 1
    end_page: 3

  crypto:
    enabled: false

  detail_request:
    method: POST
    # 同 eshop_zbjg：必须用 url_template（body_template 分支会忽略它并固定请求一个 URL）
    url_template: "http://www.e-shop.cfcpn.com/bondqcd/api/ny/getNoticeList?noticeType=001031,001032"

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors: []
    item_selectors:
      - kind: jsonpath
        expr: $.data[*]
    link_selectors:
      - kind: jsonpath
        expr: $.noticeGuid
    title_selectors:
      - kind: jsonpath
