# 智政云平台（www.zhizhengyun.com）中山大学智能电子采购系统
# 列表：POST /cms/document/listForIndex（JSON）；详情：GET /cms/document/view?id=
# 详情接口需带 sec-ch-ua 客户端提示头，否则返回未登录

- id: zhizhengyun_zbgg
  enabled: true
  name: 智政云-中山大学-招标公告
  entry_urls:
    - https://www.zhizhengyun.com/cms/document/listForIndex

  schedule:
    enabled: true
    interval_seconds: 3600

  limits:
    max_concurrency: 3
    request_interval_seconds: 0.5

  request:
    method: POST
    headers:
      Referer: https://www.zhizhengyun.com/cms/document/indexList.html?topId=c7af81fb-cb80-428b-8f36-9d2fdcf609fe
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
      X-Requested-With: XMLHttpRequest
      sec-ch-ua: '"Not=A?Brand";v="99", "Google Chrome";v="151", "Chromium";v="151"'
      sec-ch-ua-mobile: '?0'
      sec-ch-ua-platform: '"Windows"'
    params: {}
    timeout_seconds: 40
    retries: 2
    retry_backoff_seconds: 0.8
    verify_ssl: true

  pagination:
    mode: json_template
    start_page: 1
    end_page: 3
    json_template: '{"sortOrder":"asc","pageSize":10,"pageNumber":{page},"keyword":null,"topId":"c7af81fb-cb80-428b-8f36-9d2fdcf609fe"}'

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors: []
    item_selectors:
      - kind: jsonpath
        expr: $.rows[*]
    link_selectors:
      - kind: jsonpath
        expr: $.domeId
    title_selectors:
      - kind: jsonpath
        expr: $.name
    date_selectors:
      - kind: jsonpath
        expr: $.cdate
    detail_url_template: "https://www.zhizhengyun.com/cms/document/view?id={value}"
    min_title_length: 4
    fallback_auto: false

  detail_extraction:
    response_html_selectors: []
    content_selectors:
      - kind: xpath
        expr: //div[@id="content"]
    fallback_auto: true
    fallback_readability: true
    min_content_length: 30

  attachments:
    enabled: true
    selectors:
      - kind: xpath
        expr: //div[@id="content"]//a/@href
    allowed_extensions: []
    max_bytes: 52428800

  classification:
    default_type: zhaobiao
    zhongbiao_keywords: []

  area_extraction:
    enabled: true
    fixed_value: 广东
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件

