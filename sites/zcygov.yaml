# ==================== B. 政采云-贵州分站 ====================

- id: zcy_gz_yqgg
  enabled: true
  name: 政采云-贵州-邀请公告(采购公告)
  entry_urls:
    - https://gggs.guizhou.zcygov.cn/announcement/lobby/queryPage

  schedule:
    enabled: true
    interval_seconds: 3600

  limits:
    max_concurrency: 3
    request_interval_seconds: 0.5

  request:
    method: POST
    headers:
      Content-Type: application/json;charset=UTF-8
      Accept: application/json, text/plain, */*
      X-Requested-With: XMLHttpRequest
      Referer: https://gggs.guizhou.zcygov.cn/luban/announcement/list
    params: {}
    timeout_seconds: 40
    retries: 2
    retry_backoff_seconds: 0.8
    verify_ssl: false

  pagination:
    mode: json_template
    start_page: 1
    end_page: 3
    json_template: '{"pageSize":15,"pageNo":{page},"announcementTypes":[8018],"district":"","extendThird":{"blackList":[],"whiteList":["GSWSCS","GZXYGH","GZZXXJ","GZDDCG","GZQCG","GZFXJJ"]}}'

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors: []
    item_selectors:
      - kind: jsonpath
        expr: $.result.data[*]
    link_selectors:
      - kind: jsonpath
        expr: $.id
    title_selectors:
      - kind: jsonpath
        expr: $.title
    date_selectors: []
    area_selectors:
      - kind: jsonpath
        expr: $.districtName
    detail_url_template: "https://gggs.guizhou.zcygov.cn/luban/announcement/detail?encryptId={encryptId}"
    min_title_length: 5
    fallback_auto: false

  detail_request:
    method: POST
    url: https://gggs.guizhou.zcygov.cn/announcement/lobby/queryPage
    body_template: '{"announcementIds":["{link}"],"pageSize":1,"pageNo":1,"district":"","extendThird":{"blackList":[],"whiteList":["GSWSCS","GZXYGH","GZZXXJ","GZDDCG","GZQCG","GZFXJJ"]}}'

  detail_extraction:
    response_html_selectors:
      - kind: jsonpath
        expr: $.result.data[0].content
    content_selectors:
      - kind: xpath
        expr: //body
    title_selectors:
      - kind: jsonpath
        expr: $.result.data[0].title
    date_selectors:
      - kind: regex
        expr: '(\d{4}年\d{1,2}月\d{1,2}日)'
      - kind: regex
        expr: '(\d{4}-\d{1,2}-\d{1,2})'
    fallback_auto: true
    fallback_readability: true
    min_content_length: 30

  attachments:
    enabled: true
    selectors:
      - kind: xpath
        expr: //a/@href
    filename_selectors:
      - kind: xpath
        expr: //a//text()
    allowed_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".zip", ".rar", ".txt"]
    max_bytes: 52428800

  classification:
    default_type: zhaobiao
    zhongbiao_keywords: []

  area_extraction:
    enabled: true
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件

