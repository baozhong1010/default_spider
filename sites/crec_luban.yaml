    min_title_length: 5
    fallback_auto: false

  detail_extraction:
    response_html_selectors: []
    content_selectors:
      - kind: regex
        expr: '"(?:noticetitle|noticetypename|rfqcode|pubtime|area|purcompanyname|organizationalname)":"[^"]*"'
    # 详情响应恒定（同一条归档记录），所以标题/日期一律不从这里取，
    # 否则会把所有记录的日期覆盖成同一个值；留空即由引擎回退到列表项自身的值。
    title_selectors: []
    date_selectors: []
    fallback_auto: false
    fallback_readability: false
    min_content_length: 2

  attachments:
    enabled: false

  classification:
    # 竞争性谈判属于采购（招标）类
    default_type: zhaobiao
    zhongbiao_keywords: []

  area_extraction:
    enabled: true
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件

