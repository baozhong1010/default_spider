# 江苏省疾病预防控制中心（www.jscdc.cn）信息公开-采购栏目（TRS CMS 静态站）
# 列表页分页：第 1 页 = 目录 URL 本身，第 N 页 = index_{N-1}.html（index_0.html 404），
# 框架 url_template 无法同时表达「第 1 页无后缀」，故 pagination: none + entry_urls 显式列出前 3 页。
# 列表行结构：div.list_bar_item > div.left > a（@href 相对 ./YYYYMM/tYYYYMMDD_<id>.html，@title 标题） + div.right（日期）
# 详情正文：div.art_txt（TRS_Editor），无附件下载链接。
# cgzb（招标公示）栏目混合发布「招标公告」与「中标公告」，保留默认中标关键词自动分流；
# cgxq（采购需求）栏目均为需求公告，固定 zhaobiao。

- id: jscdc_cgzb
  enabled: true
  name: 江苏省疾控中心-招标公示
  entry_urls:
    - https://www.jscdc.cn/xxgk_1641/cgzb/
    - https://www.jscdc.cn/xxgk_1641/cgzb/index_1.html
    - https://www.jscdc.cn/xxgk_1641/cgzb/index_2.html

  schedule:
    enabled: true
    interval_seconds: 3600

  limits:
    max_concurrency: 3
    request_interval_seconds: 0.5

  request:
    method: GET
    headers:
      Referer: https://www.jscdc.cn/xxgk_1641/cgzb/
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    params: {}
    timeout_seconds: 40
    retries: 2
    retry_backoff_seconds: 0.8
    verify_ssl: false

  pagination:
    mode: none

  cookie:
    enabled: false

  dedup:
    redis_hash_key: zhaobiao:domian:linkqc
    ttl_days: 30
    prune_probability: 0.01

  list_extraction:
    response_html_selectors: []
    item_selectors:
      - kind: xpath
        expr: //div[contains(@class, "list_bar_item")]
    link_selectors:
      - kind: xpath
        expr: .//div[contains(@class, "left")]/a/@href
    title_selectors:
      - kind: xpath
        expr: .//div[contains(@class, "left")]/a/@title
    date_selectors:
      - kind: xpath
        expr: .//div[contains(@class, "right")]//text()
    min_title_length: 4
    fallback_auto: false

  detail_extraction:
    response_html_selectors: []
    content_selectors:
      - kind: xpath
        expr: //div[contains(@class, "art_txt")]
    fallback_auto: true
    fallback_readability: true
    min_content_length: 30

  attachments:
    enabled: false
    selectors: []
    allowed_extensions: []
    max_bytes: 52428800

  classification:
    default_type: zhaobiao
    zhongbiao_keywords: ["中标", "成交", "结果", "合同", "废标", "终止", "候选人"]

  area_extraction:
    enabled: true
    fixed_value: 江苏省
    use_title_first: true

  output:
    enabled: true
    queue_zhaobiao: zhaobiao:result:zhaobiao
    queue_zhongbiao: zhaobiao:result:zhongbiao
    attachment_dir_zhaobiao: /root/pachong/zhaobiao/data/附件
    attachment_dir_zhongbiao: /root/pachong/zhaobiao/data_zb/附件

